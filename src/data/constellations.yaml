# Constellations: groups of related open question issues, each sized for one session.
# Every open question sits in exactly one constellation; one-question constellations are fine.
# The format and its checks are in README.md under "Constellations". One entry per constellation:
#
# - name:
#     en: <English name>
#     zh: <Chinese name>
#   reasoning:
#     en: <why these questions belong together, in English>
#     zh: <the same in Chinese>
#   size: small        # small, medium or large
#   energy: low        # low, medium or high
#   issues: [142, 145] # question issue numbers
